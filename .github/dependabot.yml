# Haftalık bağımlılık güncellemeleri. Küçük ve yama sürümleri tek PR'da toplanır.
# Büyük sürümler (ör. TypeScript, ESLint, Next ana sürümleri) kod değişikliği gerektirdiği için elle yükseltilir.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      kucuk-guncellemeler:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
